name: Build Helium
description: Build one checkpointed phase and upload its disk image or checkpoint.
inputs:
  arch:
    required: true
    description: Target CPU architecture.
  GITHUB_TOKEN:
    required: true
    description: Token for release metadata retrieval.
  MACOS_CERTIFICATE:
    description: Optional base64-encoded signing certificate.
  MACOS_CERTIFICATE_PWD:
    description: Optional signing certificate password.
  MACOS_CERTIFICATE_NAME:
    description: Optional signing identity; empty selects ad-hoc signing.
  MACOS_CI_KEYCHAIN_PWD:
    description: Optional temporary keychain password.
  PROD_MACOS_NOTARIZATION_APPLE_ID:
    description: Optional notarization Apple ID.
  PROD_MACOS_NOTARIZATION_TEAM_ID:
    description: Optional notarization team ID.
  PROD_MACOS_NOTARIZATION_PWD:
    description: Optional notarization app password.
  PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64:
    description: Optional base64-encoded provisioning profile.
outputs:
  status:
    description: Whether compilation finished or requires another phase.
    value: ${{ steps.build.outputs.status }}
runs:
  using: composite
  steps:
    - name: Show sccache stats before build
      run: sccache --show-stats
      shell: bash

    - name: Build
      id: build
      run: |
        set -o pipefail
        ./github_build.sh '${{ inputs.arch }}' 2>&1 | tee -a github_actions_build_${{ inputs.arch }}.log
      shell: bash

    - name: Show sccache stats after build
      run: sccache --show-stats
      shell: bash

    - name: Prepare archive of build as artifact
      id: bake
      run: |
        set -o pipefail
        ./github_prepare_artifacts.sh '${{ inputs.arch }}' | tee -a github_actions_upload_${{ inputs.arch }}.log
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        MACOS_CERTIFICATE: ${{ inputs.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PWD: ${{ inputs.MACOS_CERTIFICATE_PWD }}
        MACOS_CERTIFICATE_NAME: ${{ inputs.MACOS_CERTIFICATE_NAME }}
        MACOS_CI_KEYCHAIN_PWD: ${{ inputs.MACOS_CI_KEYCHAIN_PWD }}
        PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ inputs.PROD_MACOS_NOTARIZATION_APPLE_ID }}
        PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ inputs.PROD_MACOS_NOTARIZATION_TEAM_ID }}
        PROD_MACOS_NOTARIZATION_PWD: ${{ inputs.PROD_MACOS_NOTARIZATION_PWD }}
        PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ inputs.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
    - name: Upload part build artifact
      if: ${{ steps.build.outputs.status == 'running' }}
      uses: actions/upload-artifact@v4
      with:
        name: github_build_artifact_${{ inputs.arch }}
        path: upload_part_build/
        overwrite: true
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
    - name: Upload logs
      uses: actions/upload-artifact@v4
      with:
        name: github_build_logs_${{ inputs.arch }}
        path: upload_logs/
        overwrite: true
        retention-days: 3
        if-no-files-found: error
    - name: Upload disk-image and hash file as artifact after build
      if: ${{ steps.build.outputs.status == 'finished' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.bake.outputs.file_name }}
        path: |
          ${{ steps.bake.outputs.deltas }}
          ./release_asset/${{ steps.bake.outputs.file_name }}
          ./${{ steps.bake.outputs.file_name }}.hashes.md
        retention-days: 7
        compression-level: 0
        if-no-files-found: error
